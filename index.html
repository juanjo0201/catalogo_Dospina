<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Ospina Alta Costura — Catálogo</title>
    <meta name="description"
        content="Catálogo de prendas de segunda temporada: vestidos, chaquetas, faldas, tops, chalinas, zapatos y bolsos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <img src="assets/image-removebg-preview.png" alt="D'Ospina Alta Costura" class="brand-logo">
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero hero-centrado">
        <div class="hero-circle" aria-hidden="true"></div>
        <div class="hero-inner">
            <img src="assets/image-removebg-preview.png" alt="D'Ospina Alta Costura" class="hero-logo">
            <p class="hero-eyebrow">Catálogo 2026</p>
            <h2 class="hero-title">Porque cada evento<br>merece tu mejor<br>versión</h2>
            <p class="hero-copy">Prendas de alta costura en excelente estado</p>
        </div>
    </section>

    <section class="filters" aria-label="Filtros del catálogo">
        <div class="filters-inner">
            <div class="category-row" id="category-row">
                <!-- Las categorías se generan por JS -->
            </div>
            <div class="select-row">
                <select id="filtro-talla" aria-label="Filtrar por talla">
                    <option value="">Talla</option>
                </select>
                <select id="filtro-orden" aria-label="Ordenar por precio">
                    <option value="">Ordenar</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                </select>
            </div>
        </div>
    </section>

    <!-- GRID DE PRODUCTOS -->
    <main>
        <section class="catalog-section">
            <div class="catalog-grid" id="catalog-grid">
                <!-- Las tarjetas se generan por JS -->
            </div>
            <p class="empty-state" id="empty-state" hidden>No encontramos prendas con esos filtros. Prueba ajustando la
                búsqueda.</p>
            <div class="pagination" id="pagination">
                <!-- Los botones de página se generan por JS -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-marca">
            <img src="assets/logo_blanco_negro_recoloreado.png" alt="D'Ospina Alta Costura" class="footer-logo">
            <div>
                <p class="footer-brand">D'Ospina Alta Costura</p>
                <p class="footer-note">NIT:1.126.907.324-3</p>
                <p class="footer-note">Cra 47#75sur-19 Sabaneta-Antioquia</p>
            </div>
        </div>
        <div class="footer-links">
            <a id="btn-whatsapp-footer" href="#" target="_blank" rel="noopener">WhatsApp</a>
            <a id="btn-instagram-footer" href="#" target="_blank" rel="noopener">Instagram</a>
        </div>
    </div>
</footer>

    <!-- LIGHTBOX DE IMAGEN -->
    <div class="lightbox" id="lightbox" hidden>
        <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar imagen">✕</button>
        <img id="lightbox-img" src="" alt="">
    </div>

<!-- MODAL DE DETALLE DE PRODUCTO -->
<div class="product-modal" id="product-modal" hidden>
    <div class="product-modal-overlay" id="product-modal-overlay"></div>
    <div class="product-modal-content">
        <button class="product-modal-close" id="product-modal-close" aria-label="Cerrar">✕</button>
        <div class="product-modal-body">
            <div class="product-modal-media" id="product-modal-media"></div>
            <div class="product-modal-info">
                <span class="card-categoria" id="modal-categoria"></span>
                <h3 class="card-nombre" id="modal-nombre"></h3>
                <p class="card-precio" id="modal-precio"></p>
                <ul class="modal-detalles" id="modal-detalles"></ul>
                <a id="modal-whatsapp-btn" class="btn-lo-quiero" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.38c1.44.79 3.06 1.2 4.71 1.2h.01c5.46 0 9.91-4.45 9.91-9.91C21.9 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.16-4.94-4.35-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.14.11.31.02.5-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.27.71 1.18 1.53 1.91 1.05.94 1.94 1.24 2.21 1.38.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.63-.17 1.31z" />
                    </svg>
                    Lo quiero
                </a>
            </div>
        </div>
    </div>
</div>

<!-- BURBUJA FLOTANTE DE WHATSAPP -->
<a id="btn-whatsapp-flotante" class="whatsapp-flotante" href="#" target="_blank" rel="noopener"
    aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path
            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.38c1.44.79 3.06 1.2 4.71 1.2h.01c5.46 0 9.91-4.45 9.91-9.91C21.9 6.45 17.5 2 12.04 2zm5.8 14.02c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.16-4.94-4.35-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.14.11.31.02.5-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.27.71 1.18 1.53 1.91 1.05.94 1.94 1.24 2.21 1.38.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.43.19.5.3.07.11.07.63-.17 1.31z" />
    </svg>
</a>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
